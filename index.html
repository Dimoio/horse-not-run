<!DOCTYPE html>
<html lang="zh-CN">
<script>
  (function () {
    var t = localStorage.getItem('wd_theme_mode') || 'dark';
    document.documentElement.dataset.theme = t;
    if (t === 'light') document.documentElement.classList.add('light-mode-html');
  })();
</script>
<style>
  html[data-theme="light"],
  html[data-theme="light"] body { background-color: #a38f73 !important; }
  html[data-theme="dark"],
  html[data-theme="dark"] body { background-color: #14121f !important; }
</style>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14121f">
<title>马儿不跑</title>
<link rel="icon" type="image/png" href="images/horse.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="err"></div>

<h1><img src="images/horse.png" class="logo-icon" alt="">马儿不跑</h1>

<div class="meta">v1.20 Beta 内测 by 01 非常感谢你的游玩！上次更新：2026.10.25 如有兴趣参加Beta测试，可加入我们的QQ群：419101070</div>
<div id="farmNameBox" style="text-align: center; font-size: 14px; color: var(--farm-name-fg); margin-top: 5px; margin-bottom: 5px; cursor: pointer; max-width: 80%; margin-left: auto; margin-right: auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;" onclick="editFarmName()" title="点击修改马场名字">🏡 我的马场</div>
<div class="tb">
  <span id="stat"></span>
  <span id="globalClock" style="font-size:12px; color:var(--clock-fg); font-weight:bold; margin-right:8px;"></span>
  <button id="toggleModeBtn" onclick="toggleDisplayMode()" style="font-size:12px; padding:4px 8px; min-height:30px;">🔳 色块模式</button>
 <button id="svBtn">💾 存档选项</button>
 <button id="quickSvBtn" style="background:#2a3d2a; border-color:#4a7a4a; color:#a0e0a0;">⚡ 极速保存</button>
<button id="themeBtn" onclick="toggleTheme()" style="font-size:12px; padding:4px 8px; min-height:30px;">🌙 切换夜晚</button>
</div>

<details open>
  <summary>👑 头马 <span id="headSub" class="sb"></span></summary>
  <div id="headBox"></div>
</details>

<details open>
  <summary>马群 <span id="cCount" class="sb"></span></summary>
 <div class="filter">
  <input id="sName" placeholder="搜索名字 / 代数">
  <select id="sSex">
    <option value="">全部性别</option>
    <option value="m">♂ 雄性</option>
    <option value="f">♀ 雌性</option>
    <option value="h">⚥ 雌雄同体</option>
    <option value="exhausted">🚫 次数用尽</option>
  </select>
  <select id="sColor">
    <option value="">全部颜色</option>
  </select>
  <select id="sMut">
    <option value="">全部属性</option>
    <option value="any">带有突变</option>
    <option value="albino">白化</option>
    <option value="melanor">黑化</option>
    <option value="pie">斑点</option>
    <option value="firefly">萤火虫</option>
    <option value="sterile">不育</option>
    <option value="doubleWomb">双子宫</option>
  </select>
  <button class="danger" onclick="cleanExhaustedHorses()" style="padding: 6px 10px; font-size: 12px; white-space: nowrap; margin-left: auto;">🧹 清理耗尽</button>
</div>
  <div id="list" class="gd"></div>
</details>

<details open>
  <summary>🥚 孵化中 <span id="hatchCount" class="sb"></span></summary>
  <div id="hatch" class="gd"></div>
</details>

<details open>
  <summary>🧬 繁育 <span id="breedInfo" class="sb"></span></summary>
  <div class="breed-toolbar">
    <button id="breedSortBtn">排序：默认</button>
    <select id="breedFilterCol" class="breed-search" style="flex:1; min-height:32px; margin-bottom:0;">
      <option value="">全部颜色</option>
    </select>
    <select id="breedFilterRarity" class="breed-search" style="flex:1; min-height:32px; margin-bottom:0;">
      <option value="">全部稀有度</option>
    </select>
  </div>
  <div class="breed-wrap">
    <!-- PC 左侧父本列表 -->
    <div class="breed-col pc-only">
      <div class="breed-head">♂ 父本</div>
      <input id="breedMSearch" placeholder="搜索名字/代数" class="breed-search">
      <div id="breedM" class="breed-list"></div>
    </div>

    <!-- 手机端顶部：双大头像 -->
    <div class="mobile-only" style="width:100%; justify-content:space-around; margin-bottom:10px;">
      <div id="breedMAvatarMobile"></div>
      <div id="breedFAvatarMobile"></div>
    </div>

    <!-- PC 左侧父本大头像 -->
    <div class="breed-avatar-col pc-only" id="breedMAvatar"></div>
    
    <!-- 中间结果与操作区 -->
    <div class="breed-center-col">
      <div class="mobile-only" style="width:100%; flex-direction:column; gap:8px; margin-bottom:10px;">
         <select id="breedMSelect" class="breed-search" style="margin-bottom:0;"></select>
         <select id="breedFSelect" class="breed-search" style="margin-bottom:0;"></select>
      </div>
      <div id="breedMidInfo" class="sb" style="text-align:center; margin-bottom:10px;"></div>
      <button id="breedGoBtn" class="primary" disabled>繁育</button>
    </div>

    <!-- PC 右侧母本大头像 -->
    <div class="breed-avatar-col pc-only" id="breedFAvatar"></div>

    <!-- PC 右侧母本列表 -->
    <div class="breed-col pc-only">
      <div class="breed-head">♀ 母本</div>
      <input id="breedFSearch" placeholder="搜索名字/代数" class="breed-search">
      <div id="breedF" class="breed-list"></div>
    </div>
  </div>
</details>

<details open>
  <summary>👑 种马 <span id="studSub" class="sb"></span></summary>
  <div id="studBox"></div>
</details>

<details open id="store01-details">
  <summary>🛒 月光商店 (01) <span id="storeTimer" class="sb"></span></summary>
  <div class="store-layout">
    <div class="shopkeeper" id="shop01">
     <img src="images/01.png" alt="01" class="k01-img">
      <div class="k01-dialogue" id="k01Text">...</div>
    </div>
    <div class="store-main">
      <div id="storeGrid" class="gd3"></div>
      <div id="potionGrid" class="gd2"></div>
      <div id="capBox" style="margin-top:10px"></div>
    </div>
  </div>
</details>

<details id="store00-details" style="margin-top:10px;">
  <summary>🌑 缄默商店 (00) <span id="store00Timer" class="sb"></span> <span id="store00Sub" class="sb"></span></summary>
  <div class="store-layout">
    <div class="shopkeeper" id="shop00">
      <img src="images/00.png" alt="00" class="k01-img" style="transform: scaleX(-1);">
      <div class="k01-dialogue" id="k00Text" style="border-color:var(--dialogue-bd);color:var(--dialogue-fg);">...</div>
    </div>
    <div class="store-main">
      <div id="store00Grid" class="gd3"></div>
      <div id="potion00Grid" class="gd2"></div>
      <div id="cap00Box" style="margin-top:10px"></div>
    </div>
  </div>
</details>

<details open>
  <summary>📦 档案 <span id="arcCount" class="sb"></span></summary>
 <div class="filter" style="margin-bottom:10px;">
  <input id="arcName" placeholder="搜索名字 / 代数" oninput="mkArc()">
  <select id="arcSex" onchange="mkArc()">
    <option value="">全部性别</option>
    <option value="m">♂ 雄性</option>
    <option value="f">♀ 雌性</option>
    <option value="h">⚥ 雌雄同体</option>
  </select>
  <select id="arcColor" onchange="mkArc()">
    <option value="">全部颜色</option>
  </select>
  <select id="arcMut" onchange="mkArc()">
    <option value="">全部属性</option>
    <option value="any">带有突变</option>
    <option value="albino">白化</option>
    <option value="melanor">黑化</option>
    <option value="pie">斑点</option>
    <option value="firefly">萤火虫</option>
    <option value="sterile">不育</option>
    <option value="doubleWomb">双子宫</option>
  </select>
</div>
  <div id="arc" class="gd"></div>
</details>

<details open>
  <summary>📖 图鉴 <span id="dexCount" class="sb"></span></summary>
  <input id="dexSearch" class="dex-search" placeholder="搜索部件名（例如：龙翼）">
  <div id="dex"></div>
</details>

<details open>
  <summary>🏆 成就 <span id="achCount" class="sb"></span></summary>
  <div id="ach"></div>
</details>

<div id="modal" class="md" style="display:none">
  <div id="modalC" class="mdc"></div>
</div>

<script src="script.js"></script>
</body>
</html>
